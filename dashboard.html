<!DOCTYPE html>
<html lang="" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>dashboard :3</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css?v=14">
    <script>
        // Apply saved theme before paint
        const saved = localStorage.getItem('dash_theme') || 'dark';
        document.documentElement.dataset.theme = saved;
        // Redirect if not authed or token expired
        const _t = localStorage.getItem('dash_token');
        const _e = parseFloat(localStorage.getItem('dash_expires') || '0');
        if (!_t || Date.now() / 1000 > _e) {
            window.location.replace('index.html');
        }
    </script>
</head>
<body>
    <main style="width:100%; display:flex; flex-direction:column; align-items:center;">

        <div class="dash-header">
            <header>dashboard :3</header>
            <div class="header-actions">
                <span id="session-chip" class="session-expiry">–</span>
                <button class="btn small-btn" id="reauth-btn" onclick="reauth()">re-auth</button>
                <button class="btn small-btn" id="theme-btn" onclick="toggleTheme()">🌙</button>
                <button class="btn small-btn" onclick="logout()">logout</button>
            </div>
        </div>

        <!-- stats bar -->
        <div class="stats-bar">
            <div class="stat-chip">
                services: <strong><span id="stat-up">–</span> / <span id="stat-total">–</span></strong> online
            </div>
            <div class="stat-chip">
                checked: <strong><span id="stat-time">–</span></strong>
            </div>
            <div class="stat-chip" id="stat-msg">
                checking... :3
            </div>
            <div class="stat-chip" id="stat-vpn">vpn: –</div>
        </div>

        <div class="section-label">public :3</div>
        <div class="services-grid" id="public-grid"></div>

        <div class="section-label">private (vpn) :3</div>
        <div class="services-grid" id="vpn-grid"></div>

    </main>

    <script>
        // ── b64url helpers (for re-auth WebAuthn) ────────────────────
        function b64url_decode(str) {
            str = str.replace(/-/g, '+').replace(/_/g, '/');
            const pad = str.length % 4 === 0 ? '' : '='.repeat(4 - str.length % 4);
            return Uint8Array.from(atob(str + pad), c => c.charCodeAt(0)).buffer;
        }
        function b64url_encode(buf) {
            const bytes = new Uint8Array(buf);
            let str = '';
            for (const b of bytes) str += String.fromCharCode(b);
            return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
        }

        // ── theme ────────────────────────────────────────────────────
        function toggleTheme() {
            const html = document.documentElement;
            const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
            html.dataset.theme = next;
            localStorage.setItem('dash_theme', next);
            document.getElementById('theme-btn').textContent = next === 'dark' ? '🌙' : '☀️';
        }
        document.getElementById('theme-btn').textContent =
            document.documentElement.dataset.theme === 'dark' ? '🌙' : '☀️';

        // ── session chip ─────────────────────────────────────────────
        function updateSessionChip() {
            const expires = parseFloat(localStorage.getItem('dash_expires') || '0');
            const daysLeft = Math.ceil((expires - Date.now() / 1000) / 86400);
            const chip = document.getElementById('session-chip');
            chip.textContent = daysLeft + 'd left';
            chip.className = 'session-expiry'
                + (daysLeft <= 2  ? ' danger'
                :  daysLeft <= 7  ? ' warn'
                :                   '');
        }
        updateSessionChip();

        // ── logout ───────────────────────────────────────────────────
        async function logout() {
            const token = localStorage.getItem('dash_token');
            if (token) {
                await fetch('/api/logout', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                }).catch(() => {});
            }
            localStorage.removeItem('dash_token');
            localStorage.removeItem('dash_expires');
            window.location.replace('index.html');
        }

        // ── re-auth ──────────────────────────────────────────────────
        async function reauth() {
            const btn = document.getElementById('reauth-btn');
            btn.textContent = 'waiting...';
            btn.disabled = true;
            try {
                const opts = await fetch('/api/webauthn/auth/begin', { method: 'POST' })
                    .then(r => r.json());

                opts.challenge = b64url_decode(opts.challenge);
                if (opts.allowCredentials) {
                    opts.allowCredentials = opts.allowCredentials.map(c => ({
                        ...c, id: b64url_decode(c.id)
                    }));
                }

                const assertion = await navigator.credentials.get({ publicKey: opts });

                const body = {
                    id:    assertion.id,
                    rawId: b64url_encode(assertion.rawId),
                    type:  assertion.type,
                    response: {
                        clientDataJSON:    b64url_encode(assertion.response.clientDataJSON),
                        authenticatorData: b64url_encode(assertion.response.authenticatorData),
                        signature:         b64url_encode(assertion.response.signature),
                        userHandle: assertion.response.userHandle
                            ? b64url_encode(assertion.response.userHandle) : null,
                    },
                };

                const resp = await fetch('/api/webauthn/auth/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });

                if (resp.ok) {
                    const { token, expires } = await resp.json();
                    localStorage.setItem('dash_token',   token);
                    localStorage.setItem('dash_expires', String(expires));
                    updateSessionChip();
                } else {
                    throw new Error('auth failed');
                }
            } catch (e) {
                // silently restore button — user can try again
            } finally {
                btn.textContent = 're-auth';
                btn.disabled = false;
            }
        }

        // ── render cards ─────────────────────────────────────────────
        function shortUrl(url) {
            return url.replace(/https?:\/\//, '').replace(/\/$/, '');
        }

        function renderCards(services, gridId, tag) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = services.map(svc => `
                <a class="service-card" href="${svc.url}" target="_blank" rel="noopener">
                    <div class="card-bar">
                        <span class="card-url">${shortUrl(svc.url)}</span>
                        <div class="status-dot checking" id="status-${encodeURIComponent(svc.url)}"
                             title="checking…"></div>
                    </div>
                    <div class="card-body">
                        <span class="card-icon"><i class="bi ${svc.icon}"></i></span>
                        <span class="card-name">${svc.name}</span>
                        <span class="card-desc">${svc.desc}</span>
                        <span class="card-tag ${tag}">${tag === 'tag-public' ? 'public' : 'vpn'}</span>
                    </div>
                    <div class="card-uptime-footer">
                        <span class="card-uptime" id="uptime-${svc.name}">–</span>
                        <div class="uptime-bar" id="history-${svc.name}"></div>
                    </div>
                </a>`).join('');
        }

        // ── status tracking ──────────────────────────────────────────
        let cardsRendered = false;
        let lastChecked = null;

        function timeAgo() {
            if (!lastChecked) return '–';
            const secs = Math.round((Date.now() - lastChecked) / 1000);
            if (secs < 60) return secs + 's ago';
            return Math.floor(secs / 60) + 'm ' + (secs % 60) + 's ago';
        }

        const funMessages = [
            'all good :3',
            'everything\'s running uwu',
            'servers happy :3',
            'no fires detected :3',
        ];
        const sadMessages = [
            'some things are sad :(',
            'something\'s down :(',
            'ruh roh :(',
        ];

        function updateStats(upCount, total) {
            document.getElementById('stat-up').textContent = upCount;
            const msgEl = document.getElementById('stat-msg');

            lastChecked = Date.now();
            document.getElementById('stat-time').textContent = 'just now';

            if (upCount === total) {
                const msg = funMessages[Math.floor(Math.random() * funMessages.length)];
                msgEl.textContent = msg;
                msgEl.className = 'stat-chip stat-good';
            } else if (upCount === 0) {
                msgEl.textContent = 'everything\'s down?? :((';
                msgEl.className = 'stat-chip stat-bad';
            } else {
                const msg = sadMessages[Math.floor(Math.random() * sadMessages.length)];
                msgEl.textContent = `${upCount}/${total} — ${msg}`;
                msgEl.className = 'stat-chip stat-warn';
            }
        }

        async function checkAll() {
            document.querySelectorAll('.status-dot').forEach(d => {
                d.className = 'status-dot checking';
                d.title = 'checking…';
            });
            document.getElementById('stat-up').textContent = '–';
            document.getElementById('stat-msg').textContent = 'checking... :3';
            document.getElementById('stat-msg').className = 'stat-chip';

            const token = localStorage.getItem('dash_token');
            let resp;
            try {
                resp = await fetch('/api/status', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
            } catch {
                document.getElementById('stat-msg').textContent = 'fetch error :(';
                return;
            }

            if (resp.status === 401) {
                localStorage.removeItem('dash_token');
                localStorage.removeItem('dash_expires');
                window.location.replace('index.html');
                return;
            }

            const data = await resp.json();

            if (!cardsRendered) {
                renderCards(data.services.filter(s => s.tag === 'public'), 'public-grid', 'tag-public');
                renderCards(data.services.filter(s => s.tag === 'vpn'),    'vpn-grid',    'tag-vpn');
                document.getElementById('stat-total').textContent = data.services.length;
                cardsRendered = true;
            }

            for (const svc of data.services) {
                const dot = document.getElementById('status-' + encodeURIComponent(svc.url));
                if (dot) {
                    dot.className = 'status-dot ' + (svc.up ? 'up' : 'down');
                    dot.title = svc.up ? 'online' : 'offline';
                }

                const uptimeEl = document.getElementById('uptime-' + svc.name);
                if (uptimeEl) {
                    uptimeEl.textContent = (svc.uptime_24h !== null && svc.uptime_24h !== undefined)
                        ? svc.uptime_24h + '% 24h'
                        : '–';
                }

                const histEl = document.getElementById('history-' + svc.name);
                if (histEl && svc.history && svc.history.length > 0) {
                    histEl.innerHTML = svc.history
                        .map(up => `<div class="uptime-block ${up ? 'up' : 'down'}"></div>`)
                        .join('');
                }
            }

            const vpnChip = document.getElementById('stat-vpn');
            if (data.vpn) {
                vpnChip.textContent = 'vpn: connected :3';
                vpnChip.className = 'stat-chip stat-good';
            } else {
                vpnChip.textContent = 'vpn: disconnected :(';
                vpnChip.className = 'stat-chip stat-bad';
            }

            const upCount = data.services.filter(s => s.up).length;
            updateStats(upCount, data.services.length);
        }

        checkAll();
        setInterval(checkAll, 60_000);
        setInterval(() => {
            if (lastChecked) document.getElementById('stat-time').textContent = timeAgo();
        }, 1000);
    </script>
</body>
</html>
